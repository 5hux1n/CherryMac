name: Deploy keyboard web app
on:
  push:
    branches: [main]
    paths: ['Web/**', '.github/workflows/web-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - run: python3 Web/build-static.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: Web/static-dist
      - uses: actions/deploy-pages@v4
        id: deploy
